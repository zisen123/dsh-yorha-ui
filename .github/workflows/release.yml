name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) throw new Error('Expected tag ' + expected + ', received ' + process.env.RELEASE_TAG)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checks
        run: pnpm run check

      - name: Build package
        run: pnpm run build

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          mkdir -p .release
          npm pack --pack-destination .release
          package_file="$(find .release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_file"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.archive.outputs.package_file }}
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Publish package to npm
        env:
          PACKAGE_FILE: ${{ steps.archive.outputs.package_file }}
        run: npm publish "$PACKAGE_FILE" --access public

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
