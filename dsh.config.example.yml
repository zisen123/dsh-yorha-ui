# NOTE — this file is kept for reference only.
#
# DSH (this generation) has no project-level `dsh.config.yml`. A "web" profile
# lives at `$DSH_HOME/profiles/web` and is configured by two files:
#
#   - package.json        dependencies + the dsh.profile.bundles layer list
#   - cordis.patch.yml    the user's own loader patch layer
#
# Installing `dsh-yorha-ui` via `dsh plugin --profile web add -w .`
# performs both steps automatically (dependency + bundle promotion, whose
# cordis.patch.yml inserts the plugin row). If you prefer to enable the plugin
# manually — e.g. the package is already installed as a dependency — insert
# this row into ~/.dsh/profiles/web/cordis.patch.yml:
#
#   - insert:
#       - id: ui-yorha
#         name: 'dsh-yorha-ui'
#
# The theme follows the GUI's Appearance (light/dark) setting; there is no
# per-plugin boolean config in this version. Palette and strictness are
# compiled in from src/client.ts.
