<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">dsh-yorha-ui visual preview</title>
  <desc id="desc">Sand and charcoal tactical terminal interface with a YoRHa-style workspace rail, central command composer, and system status panel.</desc>
  <defs>
